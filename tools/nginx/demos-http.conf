# Client demos at https://lewisthompson.dev/for/<slug>/, password-gated. http context: included at the top of
# the lewisthompson vhost, before its server blocks. Installed by `tools/demos.sh setup`; edit here, not on the box.
#
# The gate (site/gate/) sets a cookie, demo_key, scoped to /for/<slug>/, holding
# sha256("lewisthompson.dev/for/<slug>\n<password>"). A request is let through when "<slug>:<cookie>" is a line
# of the keys map, which only tools/demos.sh writes and only root can read. Nothing here knows a password.

map $uri $demo_slug {
    ~^/for/([a-z0-9-]+)/  $1;
    default               "";
}

map "$demo_slug:$cookie_demo_key" $demo_ok {
    default 0;
    include /etc/nginx/lewisthompson-demos.map;
}

# Guessing is throttled, browsing isn't: requests already let through have an empty key, which limit_req ignores.
map $demo_ok $demo_guess {
    1       "";
    default $binary_remote_addr;
}
limit_req_zone $demo_guess zone=demo_guess:1m rate=12r/m;
