# Installed by `tools/demos.sh setup` (lewisthompson.dev repo) as /etc/nginx/conf.d/lewisthompson-demos-maphash.conf.
# The demos' keys map holds lines of a slug and 64 hex digits, longer than the droplet's default bucket of 64: the
# first real key failed `nginx -t` (2026-11-03; the Air's nginx defaults to 128 and passed). nginx takes this only
# before the first `map` it parses, and conf.d is included before sites-enabled. Nothing else may set it, or
# nginx refuses the duplicate.
map_hash_bucket_size 256;
