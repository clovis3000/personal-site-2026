# Client demos, server context: included inside the lewisthompson.dev server block. See demos-http.conf.
# Installed by `tools/demos.sh setup`; edit here, not on the box.
#
# The files live in /var/www/lewisthompson-demos/for/<slug>/, outside the site's root, because `just deploy`
# mirrors site/ with --delete and would take them with it.

location = /for/ { return 404; }

location ^~ /for/ {
    root /var/www/lewisthompson-demos;

    # an add_header here drops the server's own, so they are repeated
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # without the cookie, anything under the demo is the gate, at the URL asked for, so signing in lands there
    error_page 401 @demo_gate;

    # the cookie is scoped to /for/<slug>/, so the bare slug has to gain its slash before it is checked
    location ~ ^/for/[a-z0-9-]+$ { return 301 $uri/; }

    # the gate's heading: the client's name, public by design (the gate shows it to anyone with the link)
    location ~ ^/for/[a-z0-9-]+/_gate\.json$ { }

    if ($demo_ok = 0) { return 401; }
    try_files $uri $uri/ =404;
}

# Every refusal comes through here, so this is where guessing is throttled: the `return 401` above runs in the
# rewrite phase, before a limit_req beside it would ever be consulted (found testing, 2026-11-03)
location @demo_gate {
    limit_req zone=demo_guess burst=10 nodelay;
    limit_req_status 429;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    root /var/www/lewisthompson;
    try_files /gate/index.html =404;
}
